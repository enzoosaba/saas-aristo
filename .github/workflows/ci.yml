name: Verify
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
      - run: docker build -t aristo:ci .
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aristo
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: aristo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aristo -d aristo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://aristo:ci-only-password@localhost:5432/aristo_test
      TEST_DATABASE_URL: postgresql://aristo:ci-only-password@localhost:5432/aristo_test
      # Fase 3B part 6: this whole Postgres service is destroyed at the end
      # of the job, same as DATABASE_URL above — a fixed, plainly-visible
      # password here carries the same (non-)risk as aristo's own. Not used
      # by any runtime code yet (that's part 7); provisioned so the script
      # that does this against the real database is exercised here too.
      APP_DATABASE_URL: postgresql://aristo_app:ciOnlyAppPassword2026@localhost:5432/aristo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: node scripts/provision-app-role.mjs --password ciOnlyAppPassword2026 --print-url
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-browser-results
          path: test-results/
