name: Verify
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The single lockfile is pnpm-lock.yaml; the pnpm version comes from the
      # "packageManager" field of package.json (pnpm/action-setup reads it).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
      - run: docker build -t aristo:ci .
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aristo
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: aristo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aristo -d aristo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://aristo:ci-only-password@localhost:5432/aristo_test
      TEST_DATABASE_URL: postgresql://aristo:ci-only-password@localhost:5432/aristo_test
      # Fase 3B part 6/7: this whole Postgres service is destroyed at the
      # end of the job, same as DATABASE_URL above — a fixed,
      # plainly-visible password here carries the same (non-)risk as
      # aristo's own. Since database.ts's pool() now prefers
      # APP_DATABASE_URL when it's set (part 7), this job's test:e2e run
      # below connects as aristo_app for real, with a real Postgres service
      # that actually authenticates connections (unlike the disposable
      # PGlite instance scripts/test-postgres.mjs uses locally, which was
      # found — the hard way, via a bug this gap let through — to accept
      # any username/password as the owning role regardless of what's
      # supplied). This job is therefore the one automated, permanent
      # check that RLS is genuinely enforced end to end, not just that the
      # app's code path doesn't crash when APP_DATABASE_URL is set.
      APP_DATABASE_URL: postgresql://aristo_app:ciOnlyAppPassword2026@localhost:5432/aristo_test
    steps:
      - uses: actions/checkout@v4
      # The single lockfile is pnpm-lock.yaml; the pnpm version comes from the
      # "packageManager" field of package.json (pnpm/action-setup reads it).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:migrate
      - run: pnpm run db:migrate
      - run: node scripts/provision-app-role.mjs --password ciOnlyAppPassword2026 --print-url
      - run: pnpm run build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-browser-results
          path: test-results/
